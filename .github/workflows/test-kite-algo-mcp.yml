name: test-kite-algo-mcp

on:
  push:
    paths:
      - "mcp/**"
      - "compose*.yml"
      - ".env.example"
      - "scripts/check_mcp_http_docker.py"
      - "scripts/mcp_codex_headers.py"
      - "sdk/python/**"
      - "tests/mcp/**"
      - ".github/workflows/test-kite-algo-mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "compose*.yml"
      - ".env.example"
      - "scripts/check_mcp_http_docker.py"
      - "scripts/mcp_codex_headers.py"
      - "sdk/python/**"
      - "tests/mcp/**"
      - ".github/workflows/test-kite-algo-mcp.yml"

jobs:
  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build worker and MCP wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build sdk/python
          python -m build mcp/python
      - name: Install the built packages and locked dependencies
        run: |
          python -m pip install -r mcp/python/requirements.lock
          python -m pip install sdk/python/dist/*.whl mcp/python/dist/*.whl pytest pytest-asyncio
          python -m pip check
      - name: Assert released framework versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version("fastmcp") == "4.0.3"
          assert version("mcp") == "2.1.1"
          PY
      - name: Run installed-package MCP tests
        env:
          PYTHONPATH: ""
        run: python -m pytest tests/mcp -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate optional Compose service
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.dev.yml config --quiet
      - name: Build isolated MCP image
        run: docker build -f mcp/Dockerfile -t kite-algo-mcp:test .
      - name: Build isolated MCP test image
        run: docker build -f mcp/test.Dockerfile --build-arg MCP_RUNTIME_IMAGE=kite-algo-mcp:test -t kite-algo-mcp-tests:test .
      - name: Run MCP tests from the isolated test image
        run: docker run --rm --network none kite-algo-mcp-tests:test
      - name: Check installed dependencies and unprivileged user
        run: |
          docker run --rm --network none kite-algo-mcp:test python -m pip check
          docker run --rm --network none kite-algo-mcp:test python -c 'import os; assert os.getuid() == 10001'
      - name: Verify authenticated HTTP and profile separation
        run: python3 scripts/check_mcp_http_docker.py --image kite-algo-mcp:test
