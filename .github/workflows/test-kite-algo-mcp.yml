name: test-kite-algo-mcp

on:
  push:
    paths:
      - "mcp/**"
      - "compose*.yml"
      - ".env.example"
      - "scripts/check_mcp_http_docker.py"
      - "scripts/mcp_codex_headers.py"
      - "tests/mcp/**"
      - ".github/workflows/test-kite-algo-mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - "compose*.yml"
      - ".env.example"
      - "scripts/check_mcp_http_docker.py"
      - "scripts/mcp_codex_headers.py"
      - "tests/mcp/**"
      - ".github/workflows/test-kite-algo-mcp.yml"

jobs:
  go:
    name: Go adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go/go.mod
          cache-dependency-path: mcp/go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (includes the golden-catalog parity assertions)
        run: go test ./...

  catalog:
    name: Catalog source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The exporter loads mcp/python/kite_algo_mcp/{catalog,contracts}.py
      # standalone; pydantic is the only third-party import it needs.
      - name: Install the exporter's only third-party dependency
        run: python -m pip install "pydantic>=2,<3"
      - name: Re-export the Go catalog and golden fixture
        run: python3 mcp/go/tools/export_catalog.py
      - name: Fail if the embedded catalog drifted from its source
        run: |
          git diff --exit-code -- \
            mcp/go/internal/catalog/catalog.json \
            tests/mcp/fixtures/go_parity_tool_names.json

  parity:
    name: Golden fixture over HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go/go.mod
          cache-dependency-path: mcp/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the adapter binary
        run: go build -C mcp/go -o "$RUNNER_TEMP/kite-algo-mcp" ./cmd/kite-algo-mcp
      # Test-only MCP client, pinned to the version the retired adapter used so
      # the harness stays deterministic. python-dotenv backs the helper that
      # tests/mcp/test_codex_headers.py exercises.
      - name: Install the pinned test-only dependencies
        run: python -m pip install "fastmcp==4.0.3" pytest python-dotenv
      - name: Replay the golden catalog over the real HTTP transport
        env:
          KITE_MCP_PARITY_BIN: ${{ runner.temp }}/kite-algo-mcp
        run: python -m pytest tests/mcp -q

  docker:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.dev.yml config --quiet
          docker compose -f compose.yml -f compose.mcp-go.yml --profile mcp config --quiet
      - name: Build the adapter image
        run: docker build -f mcp/go/Dockerfile -t kite-algo-mcp:test ./mcp/go
      - name: Assert the image runs unprivileged
        run: |
          test "$(docker run --rm --network none --entrypoint id kite-algo-mcp:test -u)" = "10001"
      - name: Verify authenticated HTTP, profile gating and tool listing
        run: python3 scripts/check_mcp_http_docker.py --image kite-algo-mcp:test
