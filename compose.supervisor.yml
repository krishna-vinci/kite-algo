# Hosted-strategy process supervisor.
#
# Deliberately a separate file: compose.yml / compose.dev.yml have in-flight
# changes; this adds one service without touching them. Run with:
#
#   HOSTED_SUPERVISOR_CREDENTIAL=... \
#   docker compose -f compose.yml -f compose.supervisor.yml up -d strategy-runner
#
# The supervisor holds NO database credentials (note the absence of DB_* and of
# env_file: .env) and reaches the control plane only through the
# credential-authenticated lifecycle API on the service network.
services:
  strategy-runner:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    container_name: kite-strategy-runner
    restart: unless-stopped
    # Only the supervisor credential and its own workspace are provided.
    environment:
      # The control plane mounts its routers under /api; without the suffix every
      # lifecycle call 404s (verified against an isolated deployment).
      HOSTED_SUPERVISOR_BASE_URL: http://finance-app:8777/api
      HOSTED_SUPERVISOR_CREDENTIAL: ${HOSTED_SUPERVISOR_CREDENTIAL:?set HOSTED_SUPERVISOR_CREDENTIAL}
      # Optional: the child SDK base URL (host root). Left unset it is derived
      # from HOSTED_SUPERVISOR_BASE_URL by dropping the /api suffix, because the
      # SDK appends /api/algo-workers itself.
      HOSTED_SUPERVISOR_CHILD_BASE_URL: ${HOSTED_SUPERVISOR_CHILD_BASE_URL:-}
      HOSTED_SUPERVISOR_WORKSPACE: /var/lib/kite-supervisor
      HOSTED_SUPERVISOR_LEASE_SECONDS: ${HOSTED_SUPERVISOR_LEASE_SECONDS:-120}
      HOSTED_SUPERVISOR_HEARTBEAT_INTERVAL_S: ${HOSTED_SUPERVISOR_HEARTBEAT_INTERVAL_S:-30}
      HOSTED_SUPERVISOR_STARTUP_GRACE_S: ${HOSTED_SUPERVISOR_STARTUP_GRACE_S:-30}
      HOSTED_SUPERVISOR_TERM_GRACE_S: ${HOSTED_SUPERVISOR_TERM_GRACE_S:-10}
      HOSTED_SUPERVISOR_MAX_LOG_BYTES: ${HOSTED_SUPERVISOR_MAX_LOG_BYTES:-5242880}
      # Distinct child identity: the supervisor runs as root to install limits
      # and drop the child to this unprivileged user (created in
      # Dockerfile.supervisor). Separation is REQUIRED, so startup fails closed
      # if it cannot be established.
      HOSTED_SUPERVISOR_CHILD_UID: ${HOSTED_SUPERVISOR_CHILD_UID:-10002}
      HOSTED_SUPERVISOR_CHILD_GID: ${HOSTED_SUPERVISOR_CHILD_GID:-10002}
      HOSTED_SUPERVISOR_REQUIRE_IDENTITY_SEPARATION: "true"
      PYTHONUNBUFFERED: "1"
    volumes:
      - strategy_runner_state:/var/lib/kite-supervisor
    command:
      - python
      - -m
      - backend.strategies.supervisor
    depends_on:
      finance-app:
        condition: service_healthy

volumes:
  strategy_runner_state:
