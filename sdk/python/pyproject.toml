[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-algo-worker"
version = "0.7.2"
description = "Thin Python SDK for external Kite Algo strategy workers"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["kite", "zerodha", "algo-trading", "trading", "sdk"]
dependencies = ["requests>=2", "httpx>=0.27", "websockets>=12"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dataframe = ["pandas>=2", "numpy>=1.24"]
indicators = ["pandas>=2", "numpy>=1.24", "numba>=0.59"]

[project.urls]
Homepage = "https://github.com/krishna-vinci/kite-algo"
Documentation = "https://github.com/krishna-vinci/kite-algo/blob/main/sdk/python/README.md"
Repository = "https://github.com/krishna-vinci/kite-algo"
Issues = "https://github.com/krishna-vinci/kite-algo/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kite_algo_worker*"]
