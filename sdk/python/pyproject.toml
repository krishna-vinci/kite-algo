[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kite-algo-worker"
version = "0.6.0"
description = "Thin Python SDK for external Kite Algo strategy workers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2", "httpx>=0.27", "websockets>=12"]

[project.optional-dependencies]
dataframe = ["pandas>=2", "numpy>=1.24"]
indicators = ["pandas>=2", "numpy>=1.24", "numba>=0.59"]

[project.urls]
Source = "https://github.com/krishna-vinci/kite-algo"

[tool.setuptools.packages.find]
where = ["."]
include = ["kite_algo_worker*"]
